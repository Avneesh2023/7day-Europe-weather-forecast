<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>European City 7-Day Weather Forecast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>7-Day Weather Forecast for Europe</h1>

  <div class="search-box">
    <label for="city">Select a City:</label>
    <select id="city">
      <option value="48.85,2.35">Paris</option>
      <option value="41.90,12.49">Rome</option>
      <option value="52.52,13.40">Berlin</option>
      <option value="51.51,-0.13">London</option>
      <option value="40.42,-3.70">Madrid</option>
      <option value="59.33,18.06">Stockholm</option>
      <option value="37.98,23.73">Athens</option>
    </select>
  </div>

  <div id="forecast"></div>

  <script src="script.js"></script>
</body>
</html>
